name = "convertfiles-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "convertfiles"
database_id = "57b6d275-abaf-4981-8cd7-94e26607c318"

[vars]
ALLOWED_ORIGINS = "https://convertfiles.in,https://www.convertfiles.in,http://localhost:8777"
GITHUB_REPO = "yogeshbist/convertfiles"
GITHUB_BRANCH = "main"

# Secrets (set with `wrangler secret put NAME`, never committed):
#   ADMIN_PASSWORD  - the admin panel / app password
#   TOKEN_SECRET    - random string used to sign login tokens
#   GITHUB_TOKEN    - fine-grained PAT with Contents: read & write on the repo
#   ADSENSE_CLIENT_ID     - OAuth client id from the Google Cloud project
#   ADSENSE_CLIENT_SECRET - its secret
#   ADSENSE_REFRESH_TOKEN - one-time consent for https://www.googleapis.com/auth/adsense.readonly
