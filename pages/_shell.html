<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}} · Convert Files</title>
<meta name="description" content="{{description}}">{{robots}}
<link rel="canonical" href="{{domain}}/{{path}}">
<meta property="og:title" content="{{title}} · Convert Files">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{domain}}/{{path}}">
<meta property="og:image" content="{{domain}}/assets/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}} · Convert Files">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{domain}}/assets/og.png">
<meta name="twitter:image:alt" content="Convert Files — free file converter that runs in your browser">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#0E7C86">
<link rel="preload" href="/assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/app.css?v={{v}}">
{{head}}
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-swap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h13l-3-3"/><path d="M20 17H7l3 3"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.6 3.9 5.7 3.9 9s-1.4 6.4-3.9 9c-2.5-2.6-3.9-5.7-3.9-9S9.5 5.6 12 3z"/></symbol>
  <symbol id="i-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></symbol>
</svg>
<header class="nav">
  <div class="nav-in">
    <a class="brand" href="/"><span class="mark"><svg><use href="#i-swap"/></svg></span><b>Convert Files</b></a>
    <nav class="tabs" aria-label="Sections">
      <a class="tab" href="/" style="text-decoration:none">Convert</a>
      <a class="tab" href="/#guides" style="text-decoration:none">Guides</a>
      <a class="tab" href="/#formats" style="text-decoration:none">Formats</a>
    </nav>
    <div class="lang-wrap notranslate" translate="no">
      <button id="langBtn" class="lang-btn" aria-haspopup="listbox" aria-expanded="false" title="Change language">
        <svg aria-hidden="true"><use href="#i-globe"/></svg><span id="langCur">English</span><svg class="lang-caret" aria-hidden="true"><use href="#i-caret"/></svg>
      </button>
      <div id="langPanel" class="lang-panel" role="listbox" aria-label="Choose language" hidden>
        <input id="langSearch" type="search" placeholder="Search languages…" aria-label="Search languages" autocomplete="off">
        <ul id="langList"></ul>
      </div>
    </div>
  </div>
</header>
<main>
  <div class="legal">
{{content}}
  </div>
</main>
<footer class="footer">
  <span><b>Convert Files</b> &mdash; free, no account, nothing leaves your device.</span>
  <span class="footer-links"><a href="/#guides">Guides</a><a href="/#formats">Formats</a><a href="/about.html">About</a><a href="/#support">Support</a><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a><a href="/contact.html">Contact</a></span>
</footer>
<script src="/js/lang.js?v={{v}}"></script>
</body>
</html>
