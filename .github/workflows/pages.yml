name: Build and deploy convertfiles.in

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate pages, sitemap, ads.txt, content.js
        run: python3 build.py
      - name: Assemble the site (sources only, no dev files)
        run: |
          mkdir -p _site
          rsync -a --exclude '_site' --exclude '.git' --exclude '.github' --exclude 'api' --exclude 'test' \
                   --exclude 'pages' --exclude 'seo' --exclude 'content' --exclude 'build.py' --exclude 'serve.py' --exclude 'README.md' ./ _site/
      - name: Minify the published JS and CSS (sources in the repo stay readable)
        run: |
          pip install --quiet rjsmin rcssmin
          python3 - <<'PY'
          import pathlib, rjsmin, rcssmin
          n = 0
          for f in pathlib.Path('_site/js').glob('*.js'):
              f.write_text(rjsmin.jsmin(f.read_text())); n += 1
          for f in list(pathlib.Path('_site/css').glob('*.css')) + list(pathlib.Path('_site/admin').glob('*.css')):
              f.write_text(rcssmin.cssmin(f.read_text())); n += 1
          print('minified', n, 'files')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
